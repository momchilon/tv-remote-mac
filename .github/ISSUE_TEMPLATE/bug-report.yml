name: Bug report
description: Report a problem with the remote.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Never include pairing tokens, serial numbers, MAC addresses, IP addresses or personal network details."
  - type: input
    id: version
    attributes:
      label: App version and macOS version
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV brand and model
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened and how can it be reproduced?
      description: "Include expected behavior and the exact error message, with private details removed."
    validations:
      required: true
